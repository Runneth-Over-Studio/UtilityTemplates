name: Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes describing the purpose of this release
        required: true
        type: string
      publish:
        description: Publish to NuGet and create the GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  PROJECT_PATH: src/templates/Template/UtilityTemplates.csproj
  PACKAGE_ID: RunnethOverStudio.UtilityTemplates
  PACKAGE_DIRECTORY: artifacts/templates

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases must be built from main."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read and validate package metadata
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "$env:PROJECT_PATH"

          $version = ([string]$project.Project.PropertyGroup.PackageVersion |
            Where-Object { $_ } |
            Select-Object -First 1).Trim()
          $packageId = ([string]$project.Project.PropertyGroup.PackageId |
            Where-Object { $_ } |
            Select-Object -First 1).Trim()

          if ($packageId -ne "$env:PACKAGE_ID") {
            throw "Expected package ID '$env:PACKAGE_ID' but project declares '$packageId'."
          }

          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$') {
            throw "Package version '$version' is not a valid semantic version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

          Write-Host "Preparing UtilityTemplates $version."

      - name: Verify release tag does not already exist
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists."
            exit 1
          fi

      - name: Run Cake release build
        working-directory: src/build/Build
        run: dotnet run -- --configuration=Release

      - name: Validate NuGet package
        shell: bash
        run: |
          package="${PACKAGE_DIRECTORY}/${PACKAGE_ID}.${{ steps.version.outputs.version }}.nupkg"

          test -f "$package" || { echo "::error::Expected package not found: $package"; exit 1; }

          shopt -s nullglob
          packages=("${PACKAGE_DIRECTORY}"/*.nupkg)

          if (( ${#packages[@]} != 1 )); then
            echo "::error::Expected exactly one .nupkg but found ${#packages[@]}."
            exit 1
          fi

          echo "Validated:"
          echo "  $package"

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: UtilityTemplates-${{ steps.version.outputs.version }}
          path: ${{ env.PACKAGE_DIRECTORY }}/*.nupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment: nuget-production

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download release package
        uses: actions/download-artifact@v8
        with:
          name: UtilityTemplates-${{ needs.build.outputs.version }}
          path: release-packages

      - name: Authenticate to NuGet
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish package to NuGet
        shell: bash
        run: |
          dotnet nuget push "release-packages/${PACKAGE_ID}.${{ needs.build.outputs.version }}.nupkg" \
            --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        shell: bash
        run: |
          gh release create "${{ needs.build.outputs.tag }}" \
            "release-packages/${PACKAGE_ID}.${{ needs.build.outputs.version }}.nupkg" \
            --target "${{ github.sha }}" \
            --title "${{ needs.build.outputs.tag }} Release" \
            --notes "$RELEASE_NOTES"
